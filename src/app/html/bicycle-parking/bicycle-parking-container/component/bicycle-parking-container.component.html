<div class="bicycle-parking-container">
  <div class="bicycle-parking-container-head">
    <howell-bicycle-parking-header></howell-bicycle-parking-header>
  </div>
  <div class="bicycle-parking-container-map">
    <howell-bicycle-parking-map
      [selectdivision]="load"
      [load]="map.load"
      [selectstation]="map.select"
      (loaded)="map.onloaded($event)"
      (selected)="on.map.select($event)"
    ></howell-bicycle-parking-map>
    <div class="bicycle-parking-container-map-mask"></div>
  </div>
  <div class="bicycle-parking-container-state">
    <howell-bicycle-parking-map-state
      [load]="state.load"
      (itemclick)="state.on.item($event)"
    ></howell-bicycle-parking-map-state>
  </div>

  <div class="bicycle-parking-container-card-panel left">
    <howell-bicycle-parking-card
      class="bicycle-parking-container-card-item"
      [title]="card.division.title"
    >
      <howell-bicycle-parking-container-division></howell-bicycle-parking-container-division>
    </howell-bicycle-parking-card>

    <howell-bicycle-parking-card
      class="bicycle-parking-container-card-item"
      [title]="card.device.title"
    >
      <howell-bicycle-parking-container-device
        [load]="load"
      ></howell-bicycle-parking-container-device>
    </howell-bicycle-parking-card>

    <howell-bicycle-parking-card
      class="bicycle-parking-container-card-item"
      [title]="card.task.title"
    >
      <howell-bicycle-parking-container-task
        [load]="load"
        [unit]="card.task.unit"
        (itemclick)="card.task.on.item($event)"
      ></howell-bicycle-parking-container-task>
    </howell-bicycle-parking-card>
  </div>
  <div class="bicycle-parking-container-card-panel right">
    <howell-bicycle-parking-card
      class="bicycle-parking-container-card-item"
      [title]="card.event.record.chart.pie.title"
    >
      <howell-bicycle-parking-container-event-record-chart-pie-container
        [load]="load"
        (smoke)="card.event.record.chart.pie.on.smoke()"
        (sensor)="card.event.record.chart.pie.on.sensor($event)"
        (thirdpart)="card.event.record.chart.pie.on.thirdpart($event)"
      ></howell-bicycle-parking-container-event-record-chart-pie-container>
    </howell-bicycle-parking-card>

    <howell-bicycle-parking-card
      class="bicycle-parking-container-card-item"
      [title]="card.event.record.chart.line.title"
    >
      <howell-bicycle-parking-container-event-record-chart-line
        [load]="load"
      ></howell-bicycle-parking-container-event-record-chart-line>
    </howell-bicycle-parking-card>

    <howell-bicycle-parking-card
      class="bicycle-parking-container-card-item"
      [title]="card.event.record.list.title"
    >
      <howell-bicycle-parking-container-event-record-list
        [load]="load"
        [unit]="card.event.record.list.unit"
        (picture)="on.list.picture($event)"
        (video)="on.list.video($event)"
        [simple]="true"
      ></howell-bicycle-parking-container-event-record-list>
    </howell-bicycle-parking-card>
  </div>
</div>

<howell-bicycle-parking-window
  *ngIf="window.station.table.show"
  [model]="window.station.table"
  [title]="window.station.table.title"
  [style]="window.station.table.style"
  [mask]="false"
>
  <howell-bicycle-parking-station-table-manager
    [state]="window.station.table.state"
    (image)="window.station.table.on.image($event)"
    (details)="window.station.table.on.details($event)"
    (position)="window.station.table.on.position($event)"
  ></howell-bicycle-parking-station-table-manager>
</howell-bicycle-parking-window>
<howell-bicycle-parking-window
  *ngIf="window.event.smoke.show"
  [model]="window.event.smoke"
  [title]="window.event.smoke.title"
  [style]="window.event.smoke.style"
  [mask]="false"
>
  <howell-bicycle-parking-record-smoke-table-manager
    (image)="window.event.smoke.on.image($event)"
    (video)="window.event.smoke.on.video($event)"
  ></howell-bicycle-parking-record-smoke-table-manager>
</howell-bicycle-parking-window>
<howell-bicycle-parking-window
  *ngIf="window.event.sensor.show"
  [model]="window.event.sensor"
  [title]="window.event.sensor.title"
  [style]="window.event.sensor.style"
  [mask]="false"
>
  <howell-bicycle-parking-record-sensor-table-manager></howell-bicycle-parking-record-sensor-table-manager>
</howell-bicycle-parking-window>
<howell-bicycle-parking-window
  *ngIf="window.event.thirdpart.show"
  [model]="window.event.thirdpart"
  [title]="window.event.thirdpart.title"
  [style]="window.event.thirdpart.style"
  [mask]="false"
>
  <howell-bicycle-parking-record-thirdpart-table-manager
    [args]="window.event.thirdpart.args"
    (image)="window.event.thirdpart.on.image($event)"
    (video)="window.event.thirdpart.on.video($event)"
  ></howell-bicycle-parking-record-thirdpart-table-manager>
</howell-bicycle-parking-window>

<howell-bicycle-parking-window
  *ngIf="window.station.details.show"
  [model]="window.station.details"
  [title]="window.station.details.title"
  [style]="window.station.details.style"
>
  <howell-bicycle-parking-details
    [data]="window.station.details.data"
    (preview)="on.details.camera.preview($event)"
    (playback)="on.details.camera.playback($event)"
  ></howell-bicycle-parking-details>
</howell-bicycle-parking-window>

<howell-bicycle-parking-window
  *ngIf="window.picture.show && window.picture.datas.length > 0"
  [model]="window.picture"
  [title]="window.picture.title"
  [style]="window.picture.style"
>
  <app-picture-list
    [id]="window.picture.datas[window.picture.index]"
    [page]="window.picture.page"
    [zoom]="false"
    (pageChange)="picture.page($event)"
  ></app-picture-list>
</howell-bicycle-parking-window>

<howell-bicycle-parking-video-window
  *ngIf="window.video.show"
  [model]="window.video"
  [title]="window.video.title"
  [style]="window.video.style"
  [playback]="video.playback"
  [preview]="video.preview"
  (opened)="on.video.play()"
>
</howell-bicycle-parking-video-window>
