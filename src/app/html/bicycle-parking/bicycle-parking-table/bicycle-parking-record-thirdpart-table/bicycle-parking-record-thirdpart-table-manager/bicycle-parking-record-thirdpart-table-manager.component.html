<div class="bicycle-parking-record-thirdpart-table-manager">
  <div class="bicycle-parking-record-thirdpart-table-manager-head">
    <div class="forms">
      <div class="form-item">
        <div class="form-item-text">开始时间</div>
        <div class="form-item-value">
          <date-time-control
            [(date)]="table.args.duration.begin"
          ></date-time-control>
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-text">结束时间</div>
        <div class="form-item-value">
          <date-time-control
            [(date)]="table.args.duration.end"
          ></date-time-control>
        </div>
      </div>
      <!-- <div class="form-item">
        <div class="form-item-text">责任区:</div>
        <div class="form-item-value">
          <hw-select [(selected)]="table.args.gridcell" [nullable]="true">
            <howell-division-select
              [(selectedId)]="table.args.gridcell"
            ></howell-division-select>
          </hw-select>
        </div>
      </div> -->
      <div class="form-item">
        <div class="form-item-text">事件类型:</div>
        <div class="form-item-value">
          <hw-select [(selected)]="table.args.type" [nullable]="true">
            <select [(ngModel)]="table.args.type">
              <option [ngValue]="item.key" *ngFor="let item of source.types">
                {{ item.value }}
              </option>
            </select>
          </hw-select>
        </div>
      </div>
      <div class="form-item submit">
        <button class="button-border-blue" (click)="on.search()">查询</button>
      </div>
    </div>
  </div>
  <div class="bicycle-parking-record-thirdpart-table-manager-body">
    <howell-bicycle-parking-record-thirdpart-table-content
      [args]="table.args"
      [load]="table.load"
      (image)="on.image($event)"
      (video)="on.video($event)"
    ></howell-bicycle-parking-record-thirdpart-table-content>
  </div>
</div>
